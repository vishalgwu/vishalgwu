<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif" role="img" aria-label="Portfolio VI, now playing: a sunset-and-neon, game-world portfolio where every project is a mission. Fan-made homage.">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#150a3a"/><stop offset=".38" stop-color="#4a2394"/><stop offset=".62" stop-color="#d8408f"/><stop offset=".82" stop-color="#ff7a45"/><stop offset="1" stop-color="#ffc15e"/></linearGradient>
<linearGradient id="sun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff0a8"/><stop offset=".5" stop-color="#ffb347"/><stop offset="1" stop-color="#ff2e93"/></linearGradient>
<linearGradient id="word" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe08a"/><stop offset=".5" stop-color="#ff7a45"/><stop offset="1" stop-color="#ff2e93"/></linearGradient>
<mask id="slice"><rect width="1000" height="300" fill="#fff"/><rect x="380" y="196" width="240" height="2.5" fill="#000"/><rect x="380" y="208" width="240" height="4" fill="#000"/><rect x="380" y="221" width="240" height="6" fill="#000"/></mask>
<clipPath id="r"><rect width="1000" height="300" rx="14"/></clipPath>
<style>
.tw{animation:tw 3s ease-in-out infinite}.tw2{animation-delay:1.3s}.tw3{animation-delay:2.1s}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
.rise{opacity:0;animation:rise .9s cubic-bezier(.16,1,.3,1) .1s forwards}
.rise2{animation-delay:.35s}.rise3{animation-delay:.6s}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.glow{animation:gl 2.6s ease-in-out infinite}
@keyframes gl{0%,100%{opacity:.85}50%{opacity:1}}
.wheel{transform-origin:850px 188px;animation:sp 40s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.tw,.glow,.wheel{animation:none}.rise{animation:none;opacity:1}}
</style>
</defs>
<g clip-path="url(#r)">
<rect width="1000" height="300" fill="url(#sky)"/>
<g fill="#fff"><circle class="tw" cx="60" cy="30" r="1.4"/><circle class="tw tw2" cx="170" cy="62" r="1"/><circle class="tw tw3" cx="290" cy="24" r="1.3"/><circle class="tw" cx="430" cy="48" r="1"/><circle class="tw tw2" cx="640" cy="28" r="1.4"/><circle class="tw tw3" cx="760" cy="60" r="1"/><circle class="tw" cx="900" cy="34" r="1.3"/><circle class="tw tw2" cx="960" cy="78" r="1"/></g>
<circle cx="500" cy="200" r="130" fill="#ff2e93" opacity=".18"/>
<circle cx="500" cy="200" r="80" fill="url(#sun)" mask="url(#slice)"/>
<g fill="#3a1d7a" opacity=".9"><rect x="0" y="190" width="40" height="110"/><rect x="48" y="170" width="34" height="130"/><rect x="90" y="196" width="46" height="104"/><rect x="144" y="176" width="30" height="124"/><rect x="182" y="198" width="56" height="102"/><rect x="246" y="184" width="36" height="116"/><rect x="700" y="192" width="40" height="108"/><rect x="748" y="172" width="34" height="128"/><rect x="896" y="190" width="44" height="110"/><rect x="946" y="170" width="54" height="130"/></g>
<g fill="#1a0c3f"><rect x="20" y="206" width="48" height="94"/><rect x="76" y="150" width="40" height="150"/><rect x="124" y="190" width="52" height="110"/><rect x="214" y="160" width="44" height="140"/><rect x="266" y="200" width="60" height="100"/><rect x="332" y="178" width="38" height="122"/><rect x="636" y="196" width="46" height="104"/><rect x="690" y="156" width="42" height="144"/><rect x="740" y="190" width="54" height="110"/><rect x="934" y="164" width="44" height="136"/></g>
<g fill="#ffc15e" opacity=".85"><rect x="86" y="164" width="4" height="7"/><rect x="100" y="180" width="4" height="7"/><rect x="224" y="176" width="4" height="7"/><rect x="238" y="196" width="4" height="7"/><rect x="342" y="196" width="4" height="7"/><rect x="700" y="172" width="4" height="7"/><rect x="714" y="190" width="4" height="7"/><rect x="944" y="180" width="4" height="7"/></g>
<g fill="#ff2e93" opacity=".9"><rect x="100" y="166" width="4" height="7"/><rect x="132" y="206" width="4" height="7"/><rect x="274" y="214" width="4" height="7"/><rect x="750" y="206" width="4" height="7"/></g>
<g fill="#19e3d1" opacity=".9"><rect x="90" y="196" width="4" height="7"/><rect x="226" y="208" width="4" height="7"/><rect x="706" y="208" width="4" height="7"/><rect x="956" y="196" width="4" height="7"/></g>
<g class="glow"><circle cx="850" cy="188" r="44" fill="none" stroke="#ff2e93" stroke-width="2.5"/><circle cx="850" cy="188" r="30" fill="none" stroke="#19e3d1" stroke-width="1.6"/>
<g class="wheel" stroke="#ffc15e" stroke-width="1.2"><line x1="850" y1="188" x2="894" y2="188"/><line x1="850" y1="188" x2="888" y2="210"/><line x1="850" y1="188" x2="872" y2="226"/><line x1="850" y1="188" x2="850" y2="232"/><line x1="850" y1="188" x2="828" y2="226"/><line x1="850" y1="188" x2="812" y2="210"/><line x1="850" y1="188" x2="806" y2="188"/><line x1="850" y1="188" x2="812" y2="166"/><line x1="850" y1="188" x2="828" y2="150"/><line x1="850" y1="188" x2="850" y2="144"/><line x1="850" y1="188" x2="872" y2="150"/><line x1="850" y1="188" x2="888" y2="166"/></g></g>
<rect y="236" width="1000" height="64" fill="#1a0c3f"/>
<rect x="400" y="244" width="200" height="3" fill="#ff7a45" opacity=".7"/><rect x="420" y="254" width="160" height="3" fill="#ff2e93" opacity=".6"/><rect x="440" y="264" width="120" height="3" fill="#ffc15e" opacity=".5"/>
<g fill="#07040f"><path d="M40 300 C48 240 34 200 52 160 L57 161 C42 200 56 240 50 300Z"/><path d="M54 160 Q20 140 -6 170 Q24 150 54 160Z M54 160 Q40 128 8 128 Q36 138 54 160Z M54 160 Q70 128 104 134 Q72 142 54 160Z M54 160 Q96 142 112 172 Q84 152 54 160Z"/><path d="M960 300 C952 240 966 200 948 160 L943 161 C958 200 944 240 950 300Z"/><path d="M946 160 Q980 140 1006 170 Q976 150 946 160Z M946 160 Q960 128 992 128 Q964 138 946 160Z M946 160 Q930 128 896 134 Q928 142 946 160Z M946 160 Q904 142 888 172 Q916 152 946 160Z"/></g>
</g>
<text class="rise" x="500" y="58" text-anchor="middle" font-family="'Brush Script MT','Segoe Script','Lucida Handwriting',cursive" font-size="34" fill="#fff" style="filter:drop-shadow(0 0 8px #ff2e93)">now playing</text>
<text class="rise rise2" x="500" y="128" text-anchor="middle" font-size="80" letter-spacing="3" fill="url(#word)" stroke="#2a0a4a" stroke-width="1.5" paint-order="stroke">PORTFOLIO VI</text>
<text class="rise rise3" x="500" y="160" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="3" fill="#fff" opacity=".95">35 MISSIONS  ·  5 DISTRICTS  ·  1 PROTAGONIST</text>
<rect x="404" y="270" width="192" height="22" rx="11" fill="#ff2e93"/>
<text x="500" y="285.5" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" letter-spacing="2.5" fill="#fff">PRESS START  ▶</text>
</svg>
