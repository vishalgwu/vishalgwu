<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="190" viewBox="0 0 1000 190" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Impact: 94 percent Coupa-to-ERP auto-match; reviewer preparation cut from 11 to 5 minutes; lead-scoring precision 61 to 68 percent; weekly status discrepancies 18 to 8">
<style>
.c{opacity:0;animation:rise .8s cubic-bezier(.16,1,.3,1) forwards}
.c1{animation-delay:.05s}.c2{animation-delay:.2s}.c3{animation-delay:.35s}.c4{animation-delay:.5s}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.n{font-size:46px;font-weight:800;fill:#191919;letter-spacing:-1px}
.l{font-size:14px;font-weight:600;fill:#191919}
.s{font-size:12px;fill:#5E6670}
@media (prefers-reduced-motion:reduce){.c{animation:none;opacity:1}}
</style>
<rect width="1000" height="190" rx="14" fill="#F4F2EE"/>
<g class="c c1"><rect x="16" y="16" width="232" height="158" rx="12" fill="#FFFFFF" stroke="#E0DFDC"/><rect x="16" y="16" width="232" height="7" rx="3" fill="#C8F169"/><text class="n" x="34" y="88">94%</text><text class="l" x="34" y="116">Coupa-to-ERP auto-match</text><text class="s" x="34" y="138">CrossCountry Consulting</text><text class="s" x="34" y="156">FastAPI + idempotent ERP payloads</text></g>
<g class="c c2"><rect x="260" y="16" width="232" height="158" rx="12" fill="#FFFFFF" stroke="#E0DFDC"/><rect x="260" y="16" width="232" height="7" rx="3" fill="#70B5F9"/><text class="n" x="278" y="88">11 → 5 min</text><text class="l" x="278" y="116">Reviewer prep, down 55%</text><text class="s" x="278" y="138">80 paired invoice trials</text><text class="s" x="278" y="156">LangGraph + policy retrieval</text></g>
<g class="c c3"><rect x="504" y="16" width="232" height="158" rx="12" fill="#FFFFFF" stroke="#E0DFDC"/><rect x="504" y="16" width="232" height="7" rx="3" fill="#FF8FC0"/><text class="n" x="522" y="88">61 → 68%</text><text class="l" x="522" y="116">Lead-scoring precision</text><text class="s" x="522" y="138">72% recall retained, 1,200 leads</text><text class="s" x="522" y="156">Zoho · chronological holdout</text></g>
<g class="c c4"><rect x="748" y="16" width="236" height="158" rx="12" fill="#FFFFFF" stroke="#E0DFDC"/><rect x="748" y="16" width="236" height="7" rx="3" fill="#F5B942"/><text class="n" x="766" y="88">18 → 8</text><text class="l" x="766" y="116">Weekly status discrepancies</text><text class="s" x="766" y="138">Cactus Communications</text><text class="s" x="766" y="156">Repeatable SQL reconciliation</text></g>
</svg>
